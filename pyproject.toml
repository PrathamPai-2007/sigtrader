[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigforge"
version = "0.1.0"
description = "Futures setup analyzer CLI for Binance perpetual markets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
sigforge = "cli:app"

[tool.setuptools]
py-modules = ["portfolio", "cli"]

[tool.setuptools.packages.find]
include = [
    "analyzer",
    "analyzer.analysis",
    "backtest",
    "history",
    "market",
    "providers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=analyzer --cov=backtest --cov=providers --cov=history --cov=market --cov=portfolio --cov-report=term-missing --cov-fail-under=74"
